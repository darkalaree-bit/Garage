
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage d'Alex - Atelier Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            /* Couleur bois précieux sombre / cuir fumé */
            background-color: #1a0f0a; 
            background-image: url("https://www.transparenttextures.com/patterns/dark-wood.png");
            color: #f5f1e6;
        }
        
        h1, h2, h3, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .leather-border {
            border-color: #582f0e;
        }
        
        .forest-gradient {
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
        }

        /* Personnalisation des barres de défilement pour le thème sombre */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1a0f0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #7f4f24;
            border-radius: 10px;
            border: 2px solid #1a0f0a;
        }
    </style>

</head>

</body>
</html>
